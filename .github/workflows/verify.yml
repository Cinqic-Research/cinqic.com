name: Verify site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Offline structure and content guardrails. Release links need network
      # access to GitHub and stay a manual pre-publish check.
      - run: python3 scripts/verify_site.py
